dataset_name: "BioCopilot CHO-K1 Bioreactor Benchmark Dataset"
dataset_identifier: "biocopilot-cho-benchmark-v1"
dataset_url: "internal://biocopilot/data/demo/verified_cell_culture_batches.csv"
license: "Open Data Commons Open Database License (ODbL) / CC-BY-4.0"
download_date: "2026-09-29"
selected_file: "verified_cell_culture_batches.csv"
data_nature: "SYNTHETIC DEMO DATA — NOT EXPERIMENTAL DATA"
disclaimer: "Calibrated based on published mammalian CHO-cell fed-batch culture kinetics (Monod kinetics with lactate and ammonia metabolic inhibition models), but generated as synthetic benchmark data for competition validation. Never present synthetic data as experimental wet-lab data."
column_mapping:
  Time_hr: "time_h"
  Batch_Run_ID: "batch_id"
  Vessel_Vol_L: "vessel_volume_L"
  Viable_Cell_Density_1e6_mL: "VCD"
  Viability_Percent: "viability_pct"
  Glucose_Conc_g_L: "glucose_gL"
  Glutamine_Conc_mM: "glutamine_mM"
  Lactate_Conc_g_L: "lactate_gL"
  Ammonia_Conc_mM: "ammonia_mM"
  Culture_pH: "pH"
  Dissolved_Oxygen_Pct: "DO_pct"
  Temperature_C: "temp_C"
  Agitation_RPM: "rpm"
  Aeration_vvm: "gas_flow_vvm"
  Feed_Flow_mL_hr: "feed_rate_mL_h"
  Medium_Cost_Per_L: "media_cost_per_L"
reference_ranges:
  pH: [6.8, 7.4]
  DO_pct: [30.0, 70.0]
  temp_C: [36.5, 37.2]
  glucose_gL: [1.5, 6.0]
  glutamine_mM: [1.0, 5.0]
  lactate_gL: [0.0, 3.0]
  ammonia_mM: [0.0, 4.0]
  viability_pct: [80.0, 100.0]
